name: China alert

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: china-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore list of already-alerted items
        uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: china-alert-state-${{ github.run_id }}
          restore-keys: china-alert-state-

      - name: Check feeds and send alerts
        run: npx tsx scripts/china-alert.ts
        env:
          APP_URL: ${{ vars.APP_URL }}
          ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Save list of already-alerted items
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state
          key: china-alert-state-${{ github.run_id }}
